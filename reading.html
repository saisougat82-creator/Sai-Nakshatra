<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sai Nakshatra - Birth Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            padding: 25px 15px;

            background:
                radial-gradient(circle at 15% 15%, rgba(72, 95, 190, 0.35), transparent 25%),
                radial-gradient(circle at 85% 25%, rgba(0, 210, 255, 0.15), transparent 22%),
                radial-gradient(circle at 50% 90%, rgba(100, 50, 180, 0.20), transparent 30%),
                linear-gradient(135deg, #030512, #080d25, #02030b);

            position: relative;
            overflow-x: hidden;
        }

        /* Stars */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background-image:
                radial-gradient(circle, rgba(255,255,255,0.8) 1px, transparent 1px),
                radial-gradient(circle, rgba(255,255,255,0.45) 1px, transparent 1px);

            background-size: 75px 75px, 120px 120px;
            background-position: 10px 20px, 50px 80px;

            opacity: 0.45;
        }

        .container {
            width: 100%;
            max-width: 560px;
            margin: auto;
            position: relative;
            z-index: 1;
        }

        .top {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #72d9ff;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .top h1 {
            margin: 0;
            font-size: 30px;
        }

        .top p {
            margin: 10px 0 0;
            color: #bfc9e8;
            line-height: 1.5;
        }

        .box {
            width: 100%;
            padding: 30px 25px;

            border-radius: 28px;

            background: rgba(255,255,255,0.075);
            border: 1px solid rgba(255,255,255,0.16);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .section-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 22px;
        }

        .section-title p {
            margin: 8px 0 0;
            color: #aeb9d8;
            font-size: 14px;
        }

        .field {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #e9edff;
        }

        .required {
            color: #65d9ff;
        }

        input {
            width: 100%;
            padding: 15px;

            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.12);
            outline: none;

            background: rgba(0,0,0,0.25);
            color: white;

            font-size: 16px;
        }

        input:focus {
            border-color: rgba(83,210,255,0.7);
            box-shadow: 0 0 0 3px rgba(83,210,255,0.08);
        }

        input::placeholder {
            color: #7f89a8;
        }

        input[type="date"],
        input[type="time"] {
            color-scheme: dark;
        }

        .location-title {
            margin: 25px 0 15px;
            padding-top: 18px;

            border-top: 1px solid rgba(255,255,255,0.10);

            color: #71d9ff;
            font-size: 15px;
            font-weight: bold;
        }

        .continue-btn {
            width: 100%;
            margin-top: 12px;

            padding: 16px;

            border: none;
            border-radius: 30px;

            background: linear-gradient(90deg, #4facfe, #00f2fe);

            color: #06101f;
            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 8px 25px rgba(0,190,255,0.18);
        }

        .continue-btn:active {
            transform: scale(0.98);
        }

        .privacy {
            text-align: center;
            margin-top: 18px;

            color: #7f8bab;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {

            body {
                padding: 18px 12px;
            }

            .box {
                padding: 25px 18px;
                border-radius: 24px;
            }

            .top h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top">
        <div class="logo">✨ SAI NAKSHATRA</div>

        <h1>Your Reading Begins</h1>

        <p>
            Enter your birth details to prepare your personalized reading.
        </p>
    </div>

    <div class="box">

        <div class="section-title">
            <h2>🌌 Birth Details</h2>
            <p>Accurate details help prepare your reading.</p>
        </div>

        <div class="field">
            <label>
                Full Name <span class="required">*</span>
            </label>

            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
            >
        </div>

        <div class="field">
            <label>
                Date of Birth <span class="required">*</span>
            </label>

            <input
                type="date"
                id="birthDate"
            >
        </div>

        <div class="field">
            <label>
                Time of Birth <span class="required">*</span>
            </label>

            <input
                type="time"
                id="birthTime"
            >
        </div>

        <div class="location-title">
            📍 Place of Birth
        </div>

        <div class="field">
            <label>
                Country <span class="required">*</span>
            </label>

            <input
                type="text"
                id="country"
                placeholder="Enter your country"
            >
        </div>

        <div class="field">
            <label>
                State / Province <span class="required">*</span>
            </label>

            <input
                type="text"
                id="state"
                placeholder="Enter your state or province"
            >
        </div>

        <div class="field">
            <label>
                City / Place <span class="required">*</span>
            </label>

            <input
                type="text"
                id="birthPlace"
                placeholder="Enter your birth place"
            >
        </div>

        <button
            class="continue-btn"
            onclick="continueToResults()"
        >
            Continue →
        </button>

        <div class="privacy">
            🔒 Your details are used to prepare your personalized reading.
        </div>

    </div>

</div>

<script>

function continueToResults() {

    const name = document.getElementById("fullName").value.trim();
    const date = document.getElementById("birthDate").value;
    const time = document.getElementById("birthTime").value;
    const country = document.getElementById("country").value.trim();
    const state = document.getElementById("state").value.trim();
    const place = document.getElementById("birthPlace").value.trim();

    if (
        !name ||
        !date ||
        !time ||
        !country ||
        !state ||
        !place
    ) {
        alert("Please fill in all your birth details.");
        return;
    }

    localStorage.setItem("birthName", name);
    localStorage.setItem("birthDate", date);
    localStorage.setItem("birthTime", time);
    localStorage.setItem("birthCountry", country);
    localStorage.setItem("birthState", state);
    localStorage.setItem("birthPlace", place);

    window.location.href = "results.html";
}

</script>

</body>
</html>
