<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sai Nakshatra - Birth Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 20% 20%, #29306b 0, transparent 25%),
                radial-gradient(circle at 80% 70%, #172d5c 0, transparent 30%),
                linear-gradient(135deg, #050816, #0b1230, #03050d);

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .box {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 25px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            backdrop-filter: blur(12px);
            text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cbd3ff;
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 15px;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            color: #06101f;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>
