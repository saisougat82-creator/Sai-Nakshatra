<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sai Nakshatra - Your Results</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;
            font-family: Arial, sans-serif;
            color: white;

            background:
                radial-gradient(circle at 20% 20%, #29306b 0, transparent 25%),
                radial-gradient(circle at 80% 70%, #172d5c 0, transparent 30%),
                linear-gradient(135deg, #050816, #0b1230, #03050d);
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .header p {
            color: #cbd3ff;
        }

        .card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 22px;
            padding: 22px;
            margin-bottom: 18px;
            backdrop-filter: blur(12px);
        }

        .card h2 {
            margin-top: 0;
            color: #67d5ff;
        }

        .value {
            font-size: 24px;
            font-weight: bold;
        }

        .back-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;

            background: linear-gradient(90deg, #4facfe, #00f2fe);

            color: #06101f;
            font-size: 16px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>✨ Your Sai Nakshatra Reading</h1>

        <p id="welcomeMessage">
            Preparing your reading...
        </p>

    </div>
